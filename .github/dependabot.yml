version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/setup"]
    commit-message:
      prefix: "ci"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
